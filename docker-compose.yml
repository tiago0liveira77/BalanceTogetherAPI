services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: 123qwe
      MYSQL_DATABASE: balancetogether
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./BalanceTogetherAPI
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/balancetogether?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_general_ci&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123qwe
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./BalanceTogetherWebApp
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
